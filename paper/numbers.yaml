# Generated tables declared from pinned files (paper/tools/make_tables.py); rows are labels + row filters (h = 1 only).
tables:
  sensitivity:
    file: sens
    rows:
      - {group: 'known $\sigma$, comparator', label: 'uniform on $(\pm0.95)$', where: {analysis: frontier, family: known_sigma, variant: stab_0.95}}
      - {label: 'uniform on $(\pm0.999)$ (the maps)', where: {analysis: frontier, family: known_sigma, variant: stab_0.999}}
      - {label: 'uniform on $(\pm0.9999)$', where: {analysis: frontier, family: known_sigma, variant: stab_0.9999}}
      - {label: '$\sigma$-agnostic (F1 comparator)', where: {analysis: frontier, family: known_sigma, variant: sigma_agnostic}}
      - {label: 'least-squares Student-$t$ plug-in', where: {analysis: frontier, family: known_sigma, variant: ols_t}}
      - {group: 'known $\sigma$, population prior', label: '$\tau=0.15$', where: {analysis: prior, family: known_sigma, variant: tau_0.15}}
      - {label: '$\tau=0.3$ (the maps; same setting as above)', where: {analysis: prior, family: known_sigma, variant: tau_0.3}}
      - {label: '$\tau=0.6$', where: {analysis: prior, family: known_sigma, variant: tau_0.6}}
      - {group: 'unknown $\sigma$, comparator', label: 'log-uniform $\sigma$ on $[0.1,10]$', where: {analysis: frontier, family: unknown_sigma, variant: ctx_logunif_0.1_10.0}}
      - {label: 'on $[0.01,100]$ (the maps)', where: {analysis: frontier, family: unknown_sigma, variant: ctx_logunif_0.01_100.0}}
      - {label: 'on $[0.001,1000]$', where: {analysis: frontier, family: unknown_sigma, variant: ctx_logunif_0.001_1000.0}}
      - {label: 'least-squares Student-$t$ plug-in', where: {analysis: frontier, family: unknown_sigma, variant: ols_t}}
      - {group: 'unknown $\sigma$, population prior', label: '$\tau=0.15$', where: {analysis: prior, family: unknown_sigma, variant: tau_0.15_alpha_3.0}}
      - {label: '$\tau=0.6$', where: {analysis: prior, family: unknown_sigma, variant: tau_0.6_alpha_3.0}}
      - {label: '$\alpha_0=2$', where: {analysis: prior, family: unknown_sigma, variant: tau_0.3_alpha_2.0}}
      - {label: '$\alpha_0=10$', where: {analysis: prior, family: unknown_sigma, variant: tau_0.3_alpha_10.0}}
      - {group: 'noisy, ten times the sample size', label: '$q=0$', where: {analysis: f3_precision, variant: q_0.0}}
      - {label: '$q=0.755$', where: {analysis: f3_precision, variant: q_0.755}}
      - {label: '$q=2.56$', where: {analysis: f3_precision, variant: q_2.56}}
      - {label: '$q=6.5$', where: {analysis: f3_precision, variant: q_6.5}}
# Figures (paper/tools/make_figures.py). Every series is a pinned file key above plus a row filter; to add batch 4 / 5 results,
# pin the results commit under refs/files and declare the series here (no code change).
figures:
  delta: {file: s06cfg, x: {yaml: analysis.delta}}
  gap:
    panels:
      # layout only (no data): legend in {ne, sw, se, nw}; opts = extra pgfplots axis options
      - {panel: 'AR(1), known $\sigma$ (1A map)', file: map1a, where: {set: HELD, pair: "pop|stab"}, series: r, label: '$r={}$', legend: sw}
      - {panel: 'noisy AR(1), $r=1$ (F3 map)', file: f3map, where: {pair: pop-stab, h: "1", r: "1.0"}, series: q, label: '$q={}$', legend: se, opts: 'ymin=0.0004, legend columns=2'}
      - {panel: 'AR(1), unknown $\sigma$ (F1 map)', file: f1map, where: {set: HELD, pair: "pop|ctx"}, series: r, label: '$r={}$', legend: sw}
      - {panel: 'bivariate VAR(1) (F2 map)', file: f2map, where: {set: HELD, pair: pop-ctx}, series: r, label: '$r={}$', legend: sw}
  library:
    provisional: false      # batch 5 extended the F2 library map to the largest K of the theory file (S46)
    share:
      - {label: 'known $\sigma$', file: map1a, where: {set: HELD, pair: "lib|pop"}, kind: frac}
      - {label: 'unknown $\sigma$', file: f1map, where: {set: HELD, pair: "lib|pop"}, kind: frac}
      - {label: 'noisy, $q=0$', file: f3rows, where: {set: HELD, pair: pop-lib, h: "1", q: "0.0"}, kind: rows}
      - {label: 'bivariate (map)', file: f2rows, where: {set: HELD, pair: pop-lib}, kind: rows}
      - {label: 'bivariate, to $n=80$', file: b5f2libd, where: {family: F2}, kind: rows_est}
    limit:
      - {label: 'known $\sigma$', file: theory, json: nearest_atom.known_sigma}
      - {label: 'unknown $\sigma$', file: theory, json: nearest_atom.unknown_sigma}
      - {label: 'bivariate', file: theory, json: nearest_atom.f2}
  cumulative:
    panels:
      - {panel: 'known $\sigma$', file: b5cum, where: {family: 1A, variant: pop-stab, kind: cum}, series: r, order: ["0.25", "1.0", "4.0"], legend_labels: {"0.25": '$r=0.25$', "1.0": '$r=1$', "4.0": '$r=4$'}, budget: {file: theory, json_keys: [kl_1a, "0.999"]}}
      - {panel: 'noisy, $r=1$', file: b5cum, where: {family: F3, r: "1.0", kind: cum}, series: variant, order: [q_0.0, q_0.755, q_2.56, q_6.5], legend_labels: {q_0.0: '$q=0$', q_0.755: '$q=0.755$', q_2.56: '$q=2.56$', q_6.5: '$q=6.5$'}, budget: {file: theory, json_keys: [kl_1a, "0.999"]}, legend: nw, opts: 'xtick={2,5,10,20,40}'}
      - {panel: 'unknown $\sigma$, dynamics part', file: b5cum, where: {family: F1, variant: pop-ctx_nm, kind: cum}, series: r, order: ["0.25", "1.0", "4.0"], legend_labels: {"0.25": '$r=0.25$', "1.0": '$r=1$', "4.0": '$r=4$'}, budget: {file: theory, json_keys: [kl_1a, "0.999"]}}
