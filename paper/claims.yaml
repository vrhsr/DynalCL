# Claims-to-evidence table for the Track 1 manuscript (task E1). Every claim in the paper must have an entry here.
# Each entry names the evidence file by git ref and path; paper/tools/build_claims.py reads the file from git, records its
# sha256 and the commit, re-extracts the number(s), and FAILS if they differ from `expect`. Labels: VERIFIED (re-extracted
# from a result file), DERIVED (a derivation in a docs/MATH*.md file), DESIGN (a pre-registered choice, quoted from a frozen
# document), PENDING (evidence not yet available; such a claim may not appear in the text).
schema: dynaicl-claims/v1
claims:
  # ---------------------------------------------------------------- Stage 0: references and the first separability map
  - id: S0-T1
    text: "Stage 0 optimality check: 0 violations in 516 paired comparisons (min z = -0.48)."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261009T094047949167Z_separability_9123175bb3/results/summary.json}
    extract: [{json: theorem_checks.T1_n_comparisons, expect: 516}, {json: theorem_checks.T1_violations, expect: []},
              {json: theorem_checks.T1_min_z, expect: -0.48, tol: 0.005}]
  - id: S0-T2
    text: "Stage 0 calibration of the matched reference: 0 failing cells of 60 (min p = 0.0051)."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261009T094047949167Z_separability_9123175bb3/results/summary.json}
    extract: [{json: theorem_checks.T2_n_cells, expect: 60}, {json: theorem_checks.T2_failures, expect: []},
              {json: theorem_checks.T2_min_p, expect: 0.0051, tol: 0.00005}]
  - id: S0-SEP
    text: "Stage 0 map: 2 of 60 regimes separable for all three strategy pairs."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261009T094047949167Z_separability_9123175bb3/results/summary.json}
    extract: [{json: n_cells, expect: 60}, {json_len: all_pairs_separable_regimes, expect: 2}]
  - id: S0-ELIB
    text: "Stage 0 map, in-library systems: library vs continuous-prior Bayes equivalent in all 48 cells."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261009T094047949167Z_separability_9123175bb3/results/summary.json}
    extract: [{json: "separability_counts.E-LIB:matched_reference vs continuous_prior_bayes.equivalent", expect: 48}]
  # ---------------------------------------------------------------- Stage 0.5
  - id: S05-DECISION
    text: "Stage 0.5 pre-registered decision REVISE: reference reliability passed, stability across n (P2) and robustness across r (P3) failed."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261010T053729455237Z_stage05_population_advantage_51c7621b7a/results/summary.json}
    extract: [{json: decision.P1_reference_reliability, expect: true}, {json: decision.P2, expect: false},
              {json: decision.P3, expect: false}, {json: decision.P2_stable_across_n_by_h, expect: {"1": true, "5": false}}]
  - id: S05-RELIABILITY
    text: "Stage 0.5 reliability: 0 of 2736 optimality comparisons violated; 0 of 288 calibration cells failed."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261010T053729455237Z_stage05_population_advantage_51c7621b7a/results/summary.json}
    extract: [{json: reliability.T1_comparisons, expect: 2736}, {json: reliability.T1_violations, expect: 0},
              {json: reliability.T2_cells, expect: 288}, {json: reliability.T2_failures, expect: 0},
              {json: reliability.max_quadrature_error, expect: 1.3e-15, tol: 1e-16}]
  # ---------------------------------------------------------------- Stage 0.6 (noisy observations), confirmatory
  - id: S06-VERDICT
    text: "Stage 0.6 confirmatory verdict STOP: all 18 long-context gains have an adjusted upper bound below delta in both replicates; all six critical checks passed."
    label: VERIFIED
    source: {ref: 18d34b099b6c836f1d0795afe0ce132cc5b428c7, path: results_stage06_confirmatory/phaseE-20261022/results/summary.json}
    extract: [{json: decision.verdict, expect: STOP},
              {json: decision.reasons, expect: ["all 18 gains have adjusted upper bound < delta in both replicates"]},
              {json: critical_checks, expect: {calibration: true, integrity: true, numerics: true, reproducibility: true,
                                                tier1: true, tier2: true}}]
  # ---------------------------------------------------------------- Stage 1A separability map (known sigma)
  - id: S1A-MAP-Q1
    text: "Stage 1A map, held-out pop vs stab (delta 0.02): IDENTIFIABLE only for n <= 5 at r <= 1 and n <= 2 at r = 4, gaps 0.023-0.054 nats; UNIDENTIFIABLE for n >= 10 at r <= 1 and n >= 3 at r = 4."
    label: VERIFIED
    source: {ref: a499874cad30de8d9a20759b3ce73c62436c8408, path: results_stage1/map_1A/map_decisions.csv}
    extract: [{csv_minmax: estimate, where: {set: HELD, pair: "pop|stab", decision: IDENTIFIABLE}, expect: [0.0226, 0.0544], tol: 0.0005},
              {csv_max_int: n, where: {set: HELD, pair: "pop|stab", r: "0.25", decision: IDENTIFIABLE}, expect: 5},
              {csv_max_int: n, where: {set: HELD, pair: "pop|stab", r: "1.0", decision: IDENTIFIABLE}, expect: 5},
              {csv_max_int: n, where: {set: HELD, pair: "pop|stab", r: "4.0", decision: IDENTIFIABLE}, expect: 2},
              {csv_min_int: n, where: {set: HELD, pair: "pop|stab", r: "0.25", decision: UNIDENTIFIABLE}, expect: 10},
              {csv_min_int: n, where: {set: HELD, pair: "pop|stab", r: "1.0", decision: UNIDENTIFIABLE}, expect: 10},
              {csv_min_int: n, where: {set: HELD, pair: "pop|stab", r: "4.0", decision: UNIDENTIFIABLE}, expect: 3}]
  # ---------------------------------------------------------------- F1 map (unknown noise scale)
  - id: F1-MAP-Q1
    text: "F1 map, held-out pop vs context-only: IDENTIFIABLE for n <= 10 at every r, gaps 0.032-0.316 nats; UNIDENTIFIABLE for n >= 20."
    label: VERIFIED
    source: {ref: 66c58460078b6a291242debfd5a783a9f54e47a4, path: results_stage1/map_F1/f1_map_decisions.csv}
    extract: [{csv_minmax: estimate, where: {set: HELD, pair: "pop|ctx", decision: IDENTIFIABLE}, expect: [0.0324, 0.3165], tol: 0.0005},
              {csv_max_int: n, where: {set: HELD, pair: "pop|ctx", decision: IDENTIFIABLE}, expect: 10},
              {csv_min_int: n, where: {set: HELD, pair: "pop|ctx", decision: UNIDENTIFIABLE}, expect: 20}]
  - id: F1-MAP-VALID
    text: "F1 map validity: 144 node-doubling checks, largest change 5.4e-12 nats (target 1e-6)."
    label: VERIFIED
    source: {ref: 66c58460078b6a291242debfd5a783a9f54e47a4, path: results_stage1/map_F1/f1_map_checks.json}
    extract: [{json: valid, expect: true}, {json: node_doubling_checks, expect: 144}, {json: max_abs, expect: 5.36e-12, tol: 1e-14}]
  # ---------------------------------------------------------------- Stage 1A neural pilot (reported exactly as it happened)
  - id: S1A-PILOT
    text: "Stage 1A pilot, pre-registered outcome NOT RESOLVABLE (compute): budget B = 50 000 steps chosen by the convergence rule; cap 24 models per arm < the 32-model minimum."
    label: VERIFIED
    source: {ref: e260526d9f62c1ab9863e7293c68fcfb41d85af6, path: results_stage1/pilot/pilot_decision.json}
    extract: [{json: status, expect: "NOT RESOLVABLE (compute)"}, {json: B, expect: 50000}, {json: cap, expect: 24}]
  - id: S1A-PILOT-B
    text: "Why B = 50k: at 25k all controls passed but the largest validation-NLL improvement to 50k was 0.00215 (> 0.002); at 50k it was 0.00126."
    label: VERIFIED
    source: {ref: e260526d9f62c1ab9863e7293c68fcfb41d85af6, path: results_stage1/pilot/pilot_decision.json}
    extract: [{json: "max_validation_nll_improvement_to_next.25000", expect: 0.002146, tol: 0.0000005},
              {json: "max_validation_nll_improvement_to_next.50000", expect: 0.001261, tol: 0.0000005},
              {json: "controls_ok.25000", expect: true}, {json: "controls_ok.10000", expect: false}]
  - id: S1A-MIN32
    text: "The 32-model minimum and the bootstrap-calibrated power lookup were fixed before the pilot (frozen pre-registration v3)."
    label: DESIGN
    source: {ref: 3a29c1584bc8a322469842db13385a4b5dfa51f4, path: config/stage1.yaml}
    extract: [{yaml: min_models, expect: 32}]
  # ---------------------------------------------------------------- pending (may not appear in the text yet)
  - id: F1-VALIDATION
    text: "F1 references pass calibration (PIT KS, 50/80/95% coverage), continuous SBC of a and sigma^2, optimality against the context-only reference and libraries of 2/16/256 atoms, the known-sigma limit, leakage and the matched guard: 18 cells, 180 statistical tests at family level 0.01, all pass."
    label: VERIFIED
    source: {ref: ac8aecb13448efaff908df010ce1dc606e631ff2, path: results_stage2/f1_validation/f1_validation.json}
    extract: [{json: pass, expect: true}, {json: n_tests, expect: 180}, {json: family_alpha, expect: 0.01}]
  - id: F1-V9
    text: "F1-V9 mutation matrix: all 6 injected bugs detected; clean baseline passes all 19 frozen F1 tests and every extra detector (wrong truncation is caught only by the structural matched-prior guard)."
    label: VERIFIED
    source: {ref: 50a7664a07759c4a05d27cadc093c19787706a8c, path: results_stage2/f1_mutation_matrix/f1_mutation_matrix.json}
    extract: [{json: pass, expect: true}, {json: baseline_pass, expect: true}, {json_len: rows, expect: 7},
              {json: rows.5.detector_failures, expect: [matched_guard]}, {json: rows.5.failed_tests, expect: []}]
  - id: F3-MAP
    text: "F3 map (noisy observations, n = 2..9): VALID; held-out pop vs stab IDENTIFIABLE only at h = 1 for q = 0 (up to n = 7) and q = 0.755 (n = 2); largest h = 1 gap 0.047 / 0.028 / 0.015 / 0.011 nats at q = 0 / 0.755 / 2.56 / 6.5."
    label: VERIFIED
    source: {ref: 50a7664a07759c4a05d27cadc093c19787706a8c, path: results_stage2/f3_map/map_decisions.csv}
    extract: [{csv_max_int: n, where: {pair: pop-stab, q: "0.0", h: "1", decision: IDENTIFIABLE}, expect: 7},
              {csv_max_int: n, where: {pair: pop-stab, q: "0.755", h: "1", decision: IDENTIFIABLE}, expect: 2},
              {csv_max: estimate, where: {pair: pop-stab, q: "0.0", h: "1"}, expect: 0.0467, tol: 0.00005},
              {csv_max: estimate, where: {pair: pop-stab, q: "0.755", h: "1"}, expect: 0.0278, tol: 0.00005},
              {csv_max: estimate, where: {pair: pop-stab, q: "2.56", h: "1"}, expect: 0.0147, tol: 0.00005},
              {csv_max: estimate, where: {pair: pop-stab, q: "6.5", h: "1"}, expect: 0.0110, tol: 0.00005}]
  - id: F3-MAP-VALID
    text: "F3 map validity checks: node doubling 4.4e-15 nats, library vs an independent Kalman filter 5.1e-15, disjointness 0, q = 0 control vs the Stage 1A map |z| <= 2.19."
    label: VERIFIED
    source: {ref: 50a7664a07759c4a05d27cadc093c19787706a8c, path: results_stage2/f3_map/map_checks.json}
    extract: [{json: valid, expect: true}, {json: checks.i_node_doubling.max_abs_nats, expect: 4.4e-15, tol: 1e-15},
              {json: checks.iv_disjointness.held_coefficients_equal_to_an_atom, expect: 0}]
  - id: F3-LIBRARY
    text: "F3 map, library vs continuous: no held-out cell IDENTIFIABLE at any noise level; on in-library systems lib vs stab IDENTIFIABLE only at q = 0 and only for K >= 16."
    label: VERIFIED
    source: {ref: 50a7664a07759c4a05d27cadc093c19787706a8c, path: results_stage2/f3_map/map_decisions.csv}
    extract: [{csv_count: decision, where: {set: HELD, pair: pop-lib, decision: IDENTIFIABLE}, expect: 0},
              {csv_count: decision, where: {set: INLIB, pair: lib-pop, decision: IDENTIFIABLE}, expect: 0},
              {csv_count: decision, where: {set: INLIB, pair: lib-stab, q: "0.755", decision: IDENTIFIABLE}, expect: 0},
              {csv_count: decision, where: {set: INLIB, pair: lib-stab, q: "2.56", decision: IDENTIFIABLE}, expect: 0},
              {csv_count: decision, where: {set: INLIB, pair: lib-stab, q: "6.5", decision: IDENTIFIABLE}, expect: 0},
              {csv_min_int: K, where: {set: INLIB, pair: lib-stab, q: "0.0", decision: IDENTIFIABLE}, expect: 16}]
  - id: DECISION-NO-AMENDMENT2
    text: "A post-pilot budget increase (Amendment 2) was prepared and labelled as post-pilot, and not adopted; neural effort moves to F1."
    label: VERIFIED
    source: {ref: b311efbf9dd9d749aa1bcf95dd0c7b34eae74fc7, path: docs/DISCLOSURE_LOG_STAGE1.md}
    extract: [{contains: "(1) **No Amendment 2.** The Stage 1A pre-registered outcome NOT RESOLVABLE (compute) is the Stage 1A result; neural effort moves to F1", expect: true}]
  - id: GATE-DEFECT
    text: "A hole in the authorization gate (a self-made test key passed it) was found and fixed before any confirmatory run used the gate."
    label: VERIFIED
    source: {ref: b311efbf9dd9d749aa1bcf95dd0c7b34eae74fc7, path: docs/DISCLOSURE_LOG_STAGE1.md}
    extract: [{contains: "accepted a self-made `TEST-ONLY-` key with a matching test artifact for the frozen confirmatory config", expect: true},
              {contains: "No confirmatory run has ever been launched", expect: true}]
  - id: LIB-S05
    text: "Stage 0.5 (confirmatory), held-out systems: a K = 2 library is DISTINGUISHABLE from continuous-prior Bayes in 26 of 36 cells."
    label: VERIFIED
    source: {ref: 3632e9edf7699d44613c6df53ebc97ec305b0f4e, path: runs/20261010T053729455237Z_stage05_population_advantage_51c7621b7a/results/summary.json}
    extract: [{json_keycount: confirmed_secondary, key_fields: {"0": E-CONT, "2": "2"}, value: DISTINGUISHABLE, expect: 26},
