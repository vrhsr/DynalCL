  - id: LIB-1A
    text: "Stage 1A map, held-out lib vs pop: K = 1 IDENTIFIABLE in 12 of 18 cells; every K >= 16 cell UNIDENTIFIABLE (18 of 18 per K)."
    label: VERIFIED
