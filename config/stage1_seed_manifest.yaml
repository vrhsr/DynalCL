# Stage 1A seed-role table: the single source of truth for every Stage 1 seed (PREREG_stage1 section 11).
# A seed belongs to exactly one role. Code reads seeds only through dynaicl_neural/seeds.py, never as literals elsewhere
# (the map, OC and head-floor scripts predate this table; their seeds are listed here as used).
schema: stage1-seed-roles/v1
roles:
  stage1_map:          {seeds: [70001], use: "separability map (reference-only)", status: used}
  stage1_oc:           {seeds: [70101, 70102], use: "operating characteristics (synthetic)", status: used}
  stage1_head_floor:   {seeds: [70201], use: "head-family floor (reference-only)", status: used}
  smoke_and_timing:    {seeds: [69999, 12345], use: "smoke and timing runs; never decisions", status: used}
  engineering_smoke:   {seeds: [70901], use: "UNIF-only engineering smoke before the freeze", status: unused}
  j0_benchmark:        {seeds: [70902], use: "J0 throughput benchmark (random sequences; nothing evaluated)", status: unused}
  f1_map:              {seeds: [70301], use: "F1 separability map (reference-only)", status: unused}
  pilot_train:         {seeds: [71001], use: "pilot model initialisation and training data", status: unused}
  pilot_eval:          {seeds: [71101], use: "pilot evaluation and validation systems", status: unused}
  pilot_library:       {seeds: [71201], use: "pilot library atoms", status: unused}
  pilot_bootstrap:     {seeds: [71999], use: "pilot bootstrap", status: unused}
  confirmatory_train:  {seeds: [72001, 72002], use: "R1, R2 model initialisation and training data", status: unused}
  confirmatory_eval:   {seeds: [72101, 72102], use: "R1, R2 evaluation systems", status: unused}
  confirmatory_library: {seeds: [72201, 72202], use: "R1, R2 library atoms", status: unused}
  confirmatory_bootstrap: {seeds: [72999], use: "confirmatory hierarchical bootstrap", status: unused}
  test_train:          {seeds: [69101, 69102], use: "pytest end-to-end pipeline test only; never decisions", status: tests}
  test_eval:           {seeds: [69111, 69112], use: "pytest end-to-end pipeline test only; never decisions", status: tests}
  test_library:        {seeds: [69121, 69122], use: "pytest end-to-end pipeline test only; never decisions", status: tests}
  test_bootstrap:      {seeds: [69131], use: "pytest end-to-end pipeline test only; never decisions", status: tests}
